<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>AI Chat - 持续优化</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 40px;

                font-family: Arial, 'Microsoft YaHei', sans-serif;

                background: #f5f5f5;
            }

            .container {
                width: 800px;
                max-width: 100%;
                margin: 0 auto;

                background: #fff;
                padding: 30px;

                border-radius: 12px;

                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }

            h1 {
                margin-top: 0;
                margin-bottom: 10px;
            }

            .desc {
                color: #666;
                margin-bottom: 25px;
            }

            .chat-box {
                min-height: 300px;

                padding: 20px;

                margin-bottom: 20px;

                background: #f8f8f8;

                border-radius: 8px;

                white-space: pre-wrap;

                line-height: 1.8;
            }

            .input-box {
                display: flex;
                gap: 10px;
            }

            #message {
                flex: 1;

                height: 44px;

                padding: 0 14px;

                border: 1px solid #ddd;

                border-radius: 6px;

                outline: none;

                font-size: 15px;
            }

            #message:focus {
                border-color: #409eff;
            }

            button {
                height: 44px;

                padding: 0 20px;

                border: none;

                border-radius: 6px;

                background: #409eff;

                color: white;

                cursor: pointer;

                font-size: 15px;
            }

            button:hover {
                background: #337ecc;
            }

            button:disabled {
                background: #aaa;

                cursor: not-allowed;
            }

            .actions {
                display: flex;

                justify-content: space-between;

                margin-top: 15px;
            }

            #clear {
                background: #666;
            }

            #clear:hover {
                background: #555;
            }

            .status {
                margin-top: 15px;

                color: #999;

                font-size: 13px;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>🤖 AI Chat</h1>

            <div class="desc">Gucy：Streaming + SSE + 多轮对话</div>

            <!-- AI 回答区域 -->
            <div id="answer" class="chat-box">AI 回复会显示在这里...</div>

            <!-- 输入区域 -->
            <div class="input-box">
                <input
                    id="message"
                    type="text"
                    placeholder="请输入你的问题..."
                />

                <button id="send">发送</button>
            </div>

            <!-- 操作区域 -->
            <div class="actions">
                <button id="clear">清空对话</button>

                <div id="status" class="status">就绪</div>
            </div>
        </div>

        <script>
            /*
             * ========================================
             * 1. 获取 DOM
             * ========================================
             */

            const messageInput = document.querySelector('#message')

            const sendButton = document.querySelector('#send')

            const clearButton = document.querySelector('#clear')

            const answerElement = document.querySelector('#answer')

            const statusElement = document.querySelector('#status')

            /*
             * ========================================
             * 2. 对话历史
             * ========================================
             *
             * 这里就是我们的 Memory
             *
             * system
             * user
             * assistant
             * user
             * assistant
             *
             */

            const messages = [
                {
                    role: 'system',

                    content:
                        '你是一名前端架构师，请用前端工程师能理解的方式回答。'
                }
            ]

            /*
             * ========================================
             * 3. 发送消息
             * ========================================
             */

            async function sendMessage() {
                const message = messageInput.value.trim()

                /*
                 * 如果没有输入
                 */

                if (!message) {
                    return
                }

                /*
                 * 防止重复点击
                 */

                sendButton.disabled = true

                messageInput.disabled = true

                statusElement.textContent = 'AI 正在思考...'

                /*
                 * 清空当前回答区域
                 */

                answerElement.textContent = ''

                /*
                 * ====================================
                 * 4. 保存用户消息
                 * ====================================
                 */

                messages.push({
                    role: 'user',

                    content: message
                })

                /*
                 * 保存 AI 完整回答
                 */

                let assistantMessage = ''

                try {
                    /*
                     * ====================================
                     * 5. 请求 FastAPI
                     * ====================================
                     */

                    const response = await fetch(
                        'http://127.0.0.1:8000/chat/stream',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify({
                                messages: messages
                            })
                        }
                    )

                    /*
                     * HTTP 请求失败
                     */

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`)
                    }

                    /*
                     * ====================================
                     * 6. 获取 ReadableStream
                     * ====================================
                     */

                    const reader = response.body.getReader()

                    /*
                     * ====================================
                     * 7. TextDecoder
                     * ====================================
                     */

                    const decoder = new TextDecoder('utf-8')

                    /*
                     * ====================================
                     * 8. SSE Buffer
                     * ====================================
                     *
                     * 解决：
                     *
                     * 一个 SSE 消息
                     * 可能被拆成多个 chunk
                     *
                     */

                    let buffer = ''

                    /*
                     * ====================================
                     * 9. 不断读取 Stream
                     * ====================================
                     */

                    while (true) {
                        const { done, value } = await reader.read()

                        /*
                         * Stream 结束
                         */

                        if (done) {
                            break
                        }

                        /*
                         * Uint8Array
                         * ↓
                         * String
                         */

                        buffer += decoder.decode(value, {
                            stream: true
                        })

                        /*
                         * =================================
                         * 10. 按 SSE 的 \n\n 分割事件
                         * =================================
                         */

                        const events = buffer.split('\n\n')

                        /*
                         * 最后一个可能是不完整的数据
                         *
                         * 所以留下它
                         */

                        buffer = events.pop()

                        /*
                         * =================================
                         * 11. 处理完整 SSE Event
                         * =================================
                         */

                        for (const event of events) {
                            /*
                             * 找到 data:
                             */

                            const line = event
                                .split('\n')
                                .find((line) => line.startsWith('data:'))

                            /*
                             * 没有 data
                             */

                            if (!line) {
                                continue
                            }

                            /*
                             * 去掉：
                             *
                             * data:
                             *
                             */

                            const jsonText = line.slice(5).trim()

                            /*
                             * 空数据
                             */

                            if (!jsonText) {
                                continue
                            }

                            /*
                             * =================================
                             * 12. JSON.parse
                             * =================================
                             */

                            let data

                            try {
                                data = JSON.parse(jsonText)
                            } catch (error) {
                                console.error('SSE JSON 解析失败：', jsonText)

                                continue
                            }

                            /*
                             * =================================
                             * 13. AI 完成
                             * =================================
                             */

                            if (data.done) {
                                statusElement.textContent = '完成'

                                continue
                            }

                            /*
                             * =================================
                             * 14. AI 内容
                             * =================================
                             */

                            if (data.content) {
                                /*
                                 * 保存完整 AI 回复
                                 */

                                assistantMessage += data.content

                                /*
                                 * 实时显示
                                 */

                                answerElement.textContent += data.content
                            }
                        }
                    }

                    /*
                     * ====================================
                     * 15. 保存 AI 消息
                     * ====================================
                     *
                     * 非常重要
                     *
                     * 下一轮聊天需要使用
                     *
                     */

                    if (assistantMessage) {
                        messages.push({
                            role: 'assistant',

                            content: assistantMessage
                        })
                    }

                    /*
                     * ====================================
                     * 16. 清空输入框
                     * ====================================
                     */

                    messageInput.value = ''
                } catch (error) {
                    console.error('请求失败：', error)

                    answerElement.textContent = '请求失败：' + error.message

                    statusElement.textContent = '请求失败'
                } finally {
                    /*
                     * ====================================
                     * 17. 恢复按钮
                     * ====================================
                     */

                    sendButton.disabled = false

                    messageInput.disabled = false

                    /*
                     * 输入框重新获得焦点
                     */

                    messageInput.focus()
                }
            }

            /*
             * ========================================
             * 18. 点击发送
             * ========================================
             */

            sendButton.addEventListener('click', sendMessage)

            /*
             * ========================================
             * 19. Enter 发送
             * ========================================
             */

            messageInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault()

                    sendMessage()
                }
            })

            /*
             * ========================================
             * 20. 清空对话
             * ========================================
             */

            clearButton.addEventListener('click', () => {
                /*
                 * 删除 messages 中
                 * system 之后的所有消息
                 */

                messages.splice(1)

                /*
                 * 清空页面
                 */

                answerElement.textContent = 'AI 回复会显示在这里...'

                /*
                 * 状态
                 */

                statusElement.textContent = '对话已清空'

                /*
                 * 输入框
                 */

                messageInput.value = ''

                messageInput.focus()
            })
        </script>
    </body>
</html>
